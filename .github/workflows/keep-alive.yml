name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. Once a day,
# call public.keep_alive() (a `select 1`, see the migrations) through the
# REST API with the public anon key, so the database sees a real query.
#
# Needs two repository secrets, the same values as the app's env vars:
#   SUPABASE_URL       = NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_ANON_KEY  = NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# GitHub disables scheduled workflows in a repository with no commits for
# 60 days; it emails a warning first, and one click re-enables it.

on:
  schedule:
    # 06:17 UTC daily. Off the hour, when GitHub's scheduler is less busy.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping the database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # --fail makes a 4xx/5xx (e.g. the project already paused) fail the
          # run, so GitHub emails about it instead of passing silently.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
