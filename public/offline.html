<!doctype html>
<!-- Served by sw.js when the app is opened with no connection. Static and
     self-contained (no app CSS or fonts), in both languages, because the
     locale can't be looked up offline. -->
<html lang="tk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <title>TurkmenHub</title>
    <style>
      /* The app's palette (app/globals.css), copied: this page can't load it. */
      :root {
        --bg: #f7f3ec;
        --card: #ffffff;
        --line: #e4dcce;
        --text: #1d1b17;
        --muted: #5f584d;
        --button: #0e6641;
        --button-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121110;
          --card: #1c1a18;
          --line: #35312c;
          --text: #f4f0e8;
          --muted: #aca495;
          --button: #46c48b;
          --button-text: #04140c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
      }
      h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 24px; }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 999px;
        background: var(--button);
        color: var(--button-text);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Internet ýok</h1>
      <p>TurkmenHub-y açmak üçin internet gerek. Baglanyşygy barlaň we täzeden synanyşyň.</p>
      <hr />
      <h1 lang="en">You're offline</h1>
      <p lang="en">TurkmenHub needs a connection. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Täzeden synanyş · Try again</button>
    </main>
  </body>
</html>
